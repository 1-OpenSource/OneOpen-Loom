services:
  postgres:
    image: postgres:16-alpine
    container_name: oneopen-loom-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oneopen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oneopen}
      POSTGRES_DB: ${POSTGRES_DB:-oneopen_loom}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: oneopen-loom-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-oneopen}:${POSTGRES_PASSWORD:-oneopen}@postgres:5432/${POSTGRES_DB:-oneopen_loom}
      SECRET_KEY: ${SECRET_KEY:-replace-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
