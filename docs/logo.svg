<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OneOpen Loom">
  <defs>
    <linearGradient id="loom-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="loom-glow" x1="18" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- App tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#loom-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#loom-glow)"/>
  <!-- Warp (vertical) -->
  <path d="M22 16v32M32 14v36M42 16v32" fill="none" stroke="#042f2e" stroke-width="2.4" opacity=".22" stroke-linecap="round"/>
  <!-- Weft (horizontal) interlaced feel -->
  <path d="M16 24h32M14 32h36M16 40h32" fill="none" stroke="#ecfdf5" stroke-width="2.6" opacity=".9" stroke-linecap="round"/>
  <!-- Soft under-weft for depth -->
  <path d="M17 28h30M17 36h30" fill="none" stroke="#042f2e" stroke-width="1.6" opacity=".18" stroke-linecap="round"/>
  <!-- Open ring (OneOpen) -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="#f0fdfa" stroke-width="3.4"/>
  <circle cx="32" cy="32" r="3.3" fill="#042f2e" opacity=".5"/>
</svg>
