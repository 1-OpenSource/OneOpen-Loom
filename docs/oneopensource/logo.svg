<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OneOpenSource">
  <defs>
    <linearGradient id="oos-bg" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="oos-glow" x1="16" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- App tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#oos-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#oos-glow)"/>
  <!-- Community constellation: three projects linked through open center -->
  <path
    d="M32 20.5 L44.5 41.5 H19.5 Z"
    fill="none"
    stroke="#042f2e"
    stroke-width="2"
    opacity=".2"
    stroke-linejoin="round"
  />
  <path
    d="M32 24 L41.5 40 H22.5 Z"
    fill="none"
    stroke="#ecfeff"
    stroke-width="2.4"
    opacity=".55"
    stroke-linejoin="round"
  />
  <!-- Open ring (OneOpen) -->
  <circle cx="32" cy="34" r="9.5" fill="none" stroke="#f0fdfa" stroke-width="3.6"/>
  <path
    d="M32 24.5 A9.5 9.5 0 0 1 41.5 34"
    fill="none"
    stroke="#042f2e"
    stroke-width="3.6"
    opacity=".22"
    stroke-linecap="round"
  />
  <!-- Hub -->
  <circle cx="32" cy="34" r="3.4" fill="#042f2e" opacity=".55"/>
  <!-- Project nodes -->
  <circle cx="32" cy="18.5" r="3.1" fill="#ecfeff"/>
  <circle cx="46.2" cy="43.5" r="3.1" fill="#ecfeff"/>
  <circle cx="17.8" cy="43.5" r="3.1" fill="#ecfeff"/>
